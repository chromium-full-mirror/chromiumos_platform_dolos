description: Dolos control pins

compatible: "ctrl-pins"

child-binding:
  description: |
    Control pins child node
  properties:
    gpios:
      type: phandle-array
      required: true
      description: |
        The GPIO pin for control I/O
    label:
      type: string
      description: |
        Human readable string describing the control pin
