# enable TI_TXT output
CONFIG_MSPM0_IMAGE_OUTPUT_TI_TXT=y

# disable UART and I2C original drivers
CONFIG_UART_MSPM0G3XXX=n
CONFIG_I2C_MSPM0G3XXX=n

CONFIG_I2C=y

CONFIG_ADC=y

# enable %f formatting for printf and printk
CONFIG_CBPRINTF_FP_SUPPORT=y

# enable logs
CONFIG_LOG=y

# enable shell
CONFIG_SHELL=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
CONFIG_SHELL_PROMPT_UART="dolos:~> "

CONFIG_CRC=y

# enable events
CONFIG_EVENTS=y

# enable state machine framework
CONFIG_SMF=y

# enable LED API
CONFIG_LED=y
