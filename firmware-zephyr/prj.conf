CONFIG_I2C=y
CONFIG_ADC=y
# enable %f formatting for printf and printk
CONFIG_CBPRINTF_FP_SUPPORT=y
# enable logs
CONFIG_LOG=y
# enable LTO
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
# enable shell
CONFIG_SHELL=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
CONFIG_SHELL_PROMPT_UART="dolos:~> "
CONFIG_I2C_SHELL=y
CONFIG_CRC=y
# enable events
CONFIG_EVENTS=y
# enable state machine framework
CONFIG_SMF=y
# enable LED API
CONFIG_LED=y
# enable system reboot
CONFIG_REBOOT=y
# enable i2c statistics
CONFIG_STATS=y
CONFIG_I2C_STATS=y

# Copied from Ti dev board
# TODO: remove duplicates
CONFIG_CORTEX_M_SYSTICK=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CLOCK_CONTROL=y
